# 花木工作室 — HTTPS 站点模板（xy.hmykgzs.cc 由 install.sh 替换）
# URL token 脱敏：token 值不进访问日志
map $request_uri $eagle_req_sanitized {
    default $request_uri;
    "~^(?<eagle_pre>.*[?&]token=)[^&]*(?<eagle_post>.*)$" "${eagle_pre}REDACTED${eagle_post}";
}
log_format eagle '$remote_addr - $remote_user [$time_local] "$request_method $eagle_req_sanitized $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    server_name xy.hmykgzs.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name xy.hmykgzs.cc;

    ssl_certificate     /etc/letsencrypt/live/xy.hmykgzs.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xy.hmykgzs.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log /var/log/nginx/eagle_access.log eagle;

    location ~ "^/m/upload/asset/[A-Za-z0-9_-]{1,32}$" {
        client_max_body_size 60m;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/eagle_php/upload_asset.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }

    location ~ "^/m/build/[0-9]{1,18}/download$" {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/eagle_php/build_download.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }

    location ^~ /__eagle_dl/ {
        internal;
        alias /root/xyzcs_front/uploads/;
        types { }
        default_type application/vnd.android.package-archive;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:39445;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
